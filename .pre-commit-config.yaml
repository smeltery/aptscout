repos:
  - repo: local
    hooks:
      - id: go
        name: Go formatting, vet, race tests, and build
        entry: flox activate -- bash scripts/check.sh go
        language: system
        pass_filenames: false
        types_or: [go, go-mod, go-sum]
      - id: documentation
        name: LOC budgets, Markdown, links, and Mermaid
        entry: flox activate -- bash scripts/check.sh docs
        language: system
        pass_filenames: false
        always_run: true
      - id: website
        name: Formatting, TypeScript, production build, and browser checks
        entry: flox activate -- bash scripts/check.sh web
        language: system
        pass_filenames: false
        files: '^(website/|docs/|scripts/|package.json|bun.lock|playwright.config.ts)'
      - id: workflows
        name: Actions and shell validation
        entry: flox activate -- bash scripts/check.sh workflows
        language: system
        pass_filenames: false
        files: '^(\.github/|scripts/.*\.sh$)'
