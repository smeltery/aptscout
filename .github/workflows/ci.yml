name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: flox/install-flox-action@v2
      - name: Install locked dependencies
        run: flox activate -- bun install --frozen-lockfile
      - name: Go formatting, vet, race tests, and build
        run: flox activate -- bash scripts/check.sh go
      - name: Install browser for documentation and website checks
        if: runner.os == 'Linux'
        run: |
          flox activate -- bunx playwright install --with-deps chromium
      - name: Documentation and budget checks
        if: runner.os == 'Linux'
        run: flox activate -- bash scripts/check.sh docs
      - name: Website and browser checks
        if: runner.os == 'Linux'
        run: flox activate -- bash scripts/check.sh web
      - name: Workflow and shell checks
        if: runner.os == 'Linux'
        run: flox activate -- bash scripts/check.sh workflows
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
