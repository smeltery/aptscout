schema-version = "1.18.0"
[install]
go.pkg-path = "go"
go.version = "1.26.1"
bun.pkg-path = "bun"
bun.version = "1.3.11"
nodejs.pkg-path = "nodejs_22"
git.pkg-path = "git"
git.outputs = "all"
pre-commit.pkg-path = "pre-commit"
pre-commit.outputs = "all"
actionlint.pkg-path = "actionlint"
shellcheck.pkg-path = "shellcheck"
shellcheck.outputs = "all"
gnumake.pkg-path = "gnumake"
gnumake.outputs = "all"
golangci-lint.pkg-path = "golangci-lint"
golangci-lint.version = "2.11.2"
golangci-lint.pkg-group = "lint"
[hook]
on-activate = '''
  if [ "${CI:-}" != "true" ]; then
    if [ ! -d "$FLOX_ENV_PROJECT/node_modules" ]; then
      (cd "$FLOX_ENV_PROJECT" && bun install --frozen-lockfile) || return 1
    fi
    (cd "$FLOX_ENV_PROJECT" && pre-commit install) || return 1
    echo "aptscout ready — run bun run ci to verify the project"
  fi
'''
[options]
systems = ["aarch64-darwin", "x86_64-darwin", "aarch64-linux", "x86_64-linux"]
